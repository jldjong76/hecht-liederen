<!doctype html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HECHT 10 jaar — Programma op telefoon</title>
<style>
  :root{
    --deep:#0f3d5c; --teal:#0e7490; --warm:#d97706; --warm-soft:#fef3e2; --gold:#b45309;
    --line:#e2e8f0; --bg:#f6f8fa; --card:#ffffff; --muted:#64748b; --ink:#1e293b;
    --green:#15803d; --green-soft:#ecfdf5; --purple:#6d28d9; --purple-soft:#f5f3ff;
    --teal-soft:#ecfeff; --blue-soft:#eff6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    overscroll-behavior:none; touch-action:pan-y;
  }
  /* header */
  .top{
    background:linear-gradient(135deg,var(--deep) 0%,var(--teal) 100%);
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  .top h1{font-size:15px; font-weight:800; flex:1; letter-spacing:.02em;}
  .daytoggle{display:flex; background:rgba(255,255,255,.18); border-radius:999px; overflow:hidden;}
  .daytoggle button{
    background:transparent; color:#fff; border:none; font-weight:700; font-size:13px;
    padding:7px 14px; cursor:pointer;
  }
  .daytoggle button.active{background:#fff; color:var(--deep);}
  /* deck */
  #deck{position:relative; height:calc(100vh - 52px - 66px); overflow:hidden;}
  .slide{
    position:absolute; inset:0; padding:14px 16px 20px;
    display:flex; flex-direction:column;
    transition:transform .28s ease, opacity .28s ease;
    will-change:transform;
  }
  .slide.hidden{display:none;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 2px 6px rgba(15,23,42,.07); padding:18px 18px; flex:1; overflow-y:auto;
  }
  .card.geest{border-top:5px solid var(--purple);}
  .card.pauze{border-top:5px solid var(--warm); background:var(--warm-soft);}
  .card.ener{border-top:5px solid var(--green);}
  .card.norm{border-top:5px solid var(--teal);}
  .tijd{
    font-size:13px; font-weight:800; color:var(--deep); letter-spacing:.06em;
    text-transform:uppercase;
  }
  .card.pauze .tijd{color:var(--gold);}
  h2{font-size:21px; line-height:1.25; margin:6px 0 4px;}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .tag{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    padding:3px 10px; border-radius:999px;}
  .geest .tag{background:var(--purple-soft); color:var(--purple);}
  .pauze .tag{background:#fff; color:var(--gold);}
  .ener .tag{background:var(--green-soft); color:var(--green);}
  .norm .tag{background:var(--teal-soft); color:var(--teal);}
  .lbl{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin:14px 0 3px;}
  p.txt{font-size:14.5px; line-height:1.55; color:#334155;}
  p.txt b{color:var(--ink);}
  /* nav bar */
  .nav{
    position:fixed; left:0; right:0; bottom:0; height:66px;
    background:#fff; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; padding-bottom:env(safe-area-inset-bottom); z-index:10;
  }
  .nav button{
    background:var(--teal); color:#fff; border:none; border-radius:12px;
    font-size:15px; font-weight:700; padding:12px 20px; cursor:pointer;
  }
  .nav button:disabled{opacity:.35;}
  .pos{font-size:13px; font-weight:700; color:var(--muted); text-align:center;}
  .progress{display:flex; gap:4px; justify-content:center; margin-top:4px; flex-wrap:wrap;}
  .dot{width:6px; height:6px; border-radius:50%; background:#cbd5e1;}
  .dot.on{background:var(--teal);}
  .hint{text-align:center; font-size:11.5px; color:var(--muted); padding:8px 0 0;}
</style>
</head>
<body>

<div class="top">
  <h1>HECHT 10 jaar</h1>
  <div class="daytoggle">
    <button id="btn-d1" class="active" onclick="setDay('d1')">Vrijdag</button>
    <button id="btn-d2" onclick="setDay('d2')">Zaterdag</button>
  </div>
</div>

<div id="deck"></div>

<div class="nav">
  <button id="prev" onclick="go(-1)">◀ Vorige</button>
  <div class="pos"><span id="counter"></span><div class="progress" id="dots"></div></div>
  <button id="next" onclick="go(1)">Volgende ▶</button>
</div>

let day = "d1", idx = 0;
const deck = document.getElementById("deck");

function esc(s){return s;}

function build(){
  deck.innerHTML = "";
  DATA[day].forEach((it, i) => {
    const sl = document.createElement("div");
    sl.className = "slide hidden";
    sl.innerHTML = `
      <div class="card ${it.type}">
        <div class="tijd">${it.t}</div>
        <h2>${it.o}</h2>
        <div class="tags"><span class="tag">${it.tag}</span></div>
        <div class="lbl">Leiding</div>
        <p class="txt">${it.l}</p>
        <div class="lbl">Inhoudelijke aanwijzingen</div>
        <p class="txt">${it.i}</p>
        <div class="lbl">Benodigdheden</div>
        <p class="txt">${it.b}</p>
      </div>`;
    deck.appendChild(sl);
  });
  idx = 0;
  render();
}

function render(){
  const slides = deck.children;
  for(let i=0;i<slides.length;i++){
    if(i===idx){slides[i].classList.remove("hidden");}
    else{slides[i].classList.add("hidden");}
  }
  document.getElementById("counter").textContent = (idx+1) + " / " + slides.length;
  document.getElementById("dots").innerHTML = DATA[day].map((_,i)=>`<span class="dot${i===idx?" on":""}"></span>`).join("");
  document.getElementById("prev").disabled = idx===0;
  document.getElementById("next").disabled = idx===slides.length-1;
}

function go(d){
  const n = idx + d;
  if(n<0 || n>=DATA[day].length) return;
  const cur = deck.children[idx], nxt = deck.children[n];
  cur.classList.remove("hidden"); nxt.classList.remove("hidden");
  const w = deck.offsetWidth;
  nxt.style.transition="none";
  nxt.style.transform = d>0 ? "translateX(100%)" : "translateX(-100%)";
  cur.style.transition="none";
  cur.style.transform = "translateX(0)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    cur.style.transition=""; nxt.style.transition="";
    cur.style.transform = d>0 ? "translateX(-30%)" : "translateX(30%)";
    cur.style.opacity = "0";
    nxt.style.transform = "translateX(0)";
    nxt.style.opacity = "1";
    setTimeout(()=>{ cur.classList.add("hidden"); cur.style.transform=""; cur.style.opacity=""; idx=n; render(); }, 300);
  }));
}

function setDay(d){
  if(d===day) return;
  day = d;
  document.getElementById("btn-d1").className = d==="d1" ? "active" : "";
  document.getElementById("btn-d2").className = d==="d2" ? "active" : "";
  build();
}

/* swipe */
let sx=0, sy=0, swiping=false;
deck.addEventListener("touchstart", e=>{
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping=false;
},{passive:true});
deck.addEventListener("touchmove", e=>{
  const dx = e.touches[0].clientX - sx;
  const dy = e.touches[0].clientY - sy;
  if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)*1.2) swiping=true;
},{passive:true});
deck.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx;
  if(swiping && Math.abs(dx) > 50){
    if(dx < 0) go(1); else go(-1);
  }
},{passive:true});

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});

build();
</script>
